<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hrGrad)" filter="url(#shadow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Text "Hr" -->
  <text 
    x="32" 
    y="43" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
    font-size="34" 
    font-weight="900" 
    letter-spacing="-1.5" 
    fill="#ffffff" 
    text-anchor="middle"
    dominant-baseline="auto"
  >Hr</text>
  
  <!-- Subtle accent dot -->
  <circle cx="51" cy="43" r="3" fill="#34d399" />
</svg>